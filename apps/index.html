<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YNN Family</title>
<meta name="apple-mobile-web-app-title" content="YNN Family">
<meta name="application-name" content="YNN Family">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1E3A5F">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Kanit:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1E3A5F;
    --ink-light: #3D5A7A;
    --paper: #F6F3EC;
    --card: #FFFFFF;
    --gold: #B8901F;
    --sage: #43705F;
    --text-primary: #23303C;
    --text-secondary: #62707E;
    --text-muted: #94A0AB;
    --border: #E4DFD1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    font-family: 'Sarabun', sans-serif;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .wrap { max-width: 520px; width: 100%; text-align: center; }
  .logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 64px; height: 64px;
    border-radius: 16px;
    background: var(--ink);
    color: var(--gold);
    font-family: 'Kanit', sans-serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 1px;
    margin-bottom: 14px;
  }
  h1 {
    font-family: 'Kanit', sans-serif;
    font-weight: 600;
    font-size: 24px;
    color: var(--ink);
    margin: 0 0 6px;
  }
  .subtitle { color: var(--text-secondary); font-size: 14px; margin: 0 0 32px; }
  .apps { display: flex; flex-direction: column; gap: 14px; }
  .app-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    text-align: left;
    text-decoration: none;
    color: inherit;
    transition: border-color .15s, transform .15s;
  }
  .app-card:not(.disabled):hover { border-color: var(--ink); transform: translateY(-1px); }
  .app-card.disabled { opacity: .55; cursor: default; }
  .app-icon {
    flex-shrink: 0;
    width: 46px; height: 46px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    background: var(--paper);
  }
  .app-info { flex: 1; min-width: 0; }
  .app-name {
    font-family: 'Kanit', sans-serif;
    font-weight: 500;
    font-size: 16px;
    color: var(--ink);
    margin: 0 0 3px;
  }
  .app-desc { font-size: 13px; color: var(--text-secondary); margin: 0; }
  .app-badge {
    flex-shrink: 0;
    font-size: 11px;
    color: var(--text-muted);
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
    white-space: nowrap;
  }
  .arrow { flex-shrink: 0; color: var(--text-muted); font-size: 18px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">YNN</div>
    <h1>YNN Family</h1>
    <p class="subtitle">เลือกแอปที่ต้องการเข้าใช้งาน</p>
    <div class="apps">
      <a class="app-card" href="../Budget/">
        <div class="app-icon">💰</div>
        <div class="app-info">
          <p class="app-name">งบประมาณครัวเรือน</p>
          <p class="app-desc">บันทึกรายรับ-รายจ่าย เป้าหมายเงินออม งบประมาณ</p>
        </div>
        <div class="arrow">→</div>
      </a>
      <a class="app-card" href="../vaccine/">
        <div class="app-icon">💉</div>
        <div class="app-info">
          <p class="app-name">วัคซีน / สุขภาพลูก</p>
          <p class="app-desc">บันทึกวัคซีน ทันตกรรม พัฒนาการของลูก</p>
        </div>
        <div class="arrow">→</div>
      </a>
      <a class="app-card" href="../Investment/">
        <div class="app-icon">📈</div>
        <div class="app-info">
          <p class="app-name">แอพลงทุน</p>
          <p class="app-desc">ติดตามพอร์ตการลงทุน สัดส่วนสินทรัพย์ คาดการณ์เติบโต</p>
        </div>
        <div class="arrow">→</div>
      </a>
    </div>
  </div>
</body>
</html>
